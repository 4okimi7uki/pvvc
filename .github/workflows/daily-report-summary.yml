name: Daily Report (summary)

on:
  # schedule:
  #   - cron: "10 7 * * *" # Runs every day at 16:10 JST
  workflow_dispatch:
    inputs:
      stage:
        description: "Slack environment"
        required: true
        default: "prod"
        type: choice
        options:
          - dev
          - prod

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
      PROJECT_ID: ${{ secrets.PROJECT_ID }}
      PROJECT_IDS: ${{ secrets.PROJECT_IDS }}
      VERCEL_PROJECT_URL: ${{ secrets.VERCEL_PROJECT_URL }}
      PROPERTY_ID: ${{ secrets.PROPERTY_ID }}
      GOOGLE_ANALYTICS_CREDENTIAL: ${{ secrets.GOOGLE_ANALYTICS_CREDENTIAL }}
      TARGET_WEBSITE_NAME: ${{ secrets.TARGET_WEBSITE_NAME }}
      BASE_URL: ${{ secrets.BASE_URL }}
      WEBHOOK_PROD: ${{ secrets.WEBHOOK_PROD }}
      WEBHOOK_DEV: ${{ secrets.WEBHOOK_DEV }}

    steps:
      - name: Set Slack webhook URL
        run: |
          STAGE="${{ inputs.stage || 'prod' }}"
          if [ "$STAGE" = "prod" ]; then
            echo "SLACK_WEBHOOK_URL=$WEBHOOK_PROD" >> $GITHUB_ENV
          else
            echo "SLACK_WEBHOOK_URL=$WEBHOOK_DEV" >> $GITHUB_ENV
          fi

      - name: Download pvvc binary
        run: |
          gh release download \
            --repo 4okimi7uki/pvvc \
            --pattern "pvvc_linux_amd64" \
            --dir /tmp/pvvc
          chmod +x /tmp/pvvc/pvvc_linux_amd64
          sudo mv /tmp/pvvc/pvvc_linux_amd64 /usr/local/bin/pvvc
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Aggregate and notify Slack
        run: pvvc report --notify --quiet --top-pages 15

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build monthly chart page
        env:
          TZ: Asia/Tokyo
        run: |
          to=$(date -d 'yesterday' '+%Y-%m-%d')
          from=$(date -d 'yesterday -1 month' '+%Y-%m-%d')
          echo "to=$to" "from=$from"
          pvvc report --quiet --from "$from" --html=web/index.html

      - name: Commit and Push updated web/index.html
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add web/*.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "update: graph"
            git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }} HEAD:main
          fi
