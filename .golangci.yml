version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose # HTTPレスポンスのClose漏れ検知
    - noctx # context無しのHTTPリクエスト検知
    - errorlint # fmt.Errorf("%w") の正しい使い方を強制
    - gosec # トークン扱うため
    - misspell # 英語のtypo検知
    - unconvert # 不要な型変換
    - nolintlint # //nolint の濫用防止

  settings:
    govet:
      enable:
        - shadow # 変数シャドーイング検知
    gosec:
      excludes:
        - G104
    staticcheck:
      checks:
        - all
        - -ST1000 # パッケージコメント必須を無効化

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/4okimi7uki/pvvc
