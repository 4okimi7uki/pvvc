<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{ .Title }}</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                text-decoration: none;
                list-style: none;
            }
            body {
                background: #fafafa;
            }
            .main {
                width: 100%;
                display: flex;
                justify-content: center;
                padding: 10px 4%;
            }

            .chartWrapper {
                background: #ffffff;
                border: 1px solid #ccc;
                border-radius: 8px;
                padding: 10px;
                display: flex;
                justify-content: flex-start;
                overflow-x: auto;

                svg {
                    height: 300px;
                    width: auto;
                    display: block;
                }
            }
        </style>
    </head>
    <body>
        <main class="main">
            <div class="chartWrapper">{{ .Chart }}</div>
        </main>
    </body>
</html>
